name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install QRCx
        working-directory: QRCx
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest
      - name: Run tests
        working-directory: QRCx
        run: pytest tests/ -v
      - name: Check README results block is not stale
        run: python scripts/make_readme_tables.py --check
