[project]
name = "QRCx"
version = "0.1.0"
description = "Quantum Reservoir Computing for Weather Forecasting"
authors = [{ name = "QRCx Team" }]
requires-python = ">=3.10"
dependencies = [
    "pennylane==0.45.1",
    "pennylane-lightning==0.45.0",
    "scikit-learn==1.9.0",
    "pandas==3.0.3",
    "numpy==2.5.1",
    "scipy==1.18.0",
    "matplotlib==3.11.0",
    "statsmodels==0.14.6",
    "reservoirpy==0.4.2",
    "qiskit-aer==0.17.2",
    "pyyaml==6.0.3",
]

[project.urls]
Repository = "TODO(repo-url)"

[project.scripts]
QRCx = "QRCx.__main__:main"

[project.optional-dependencies]
cuda = ["cudaq>=0.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["QRCx*"]
