[project]
name = "QRCx"
version = "0.1.0"
description = "Quantum Reservoir Computing for Weather Forecasting"
requires-python = ">=3.10"
dependencies = [
    "pennylane>=0.35",
    "pennylane-lightning>=0.35",
    "scikit-learn>=1.3",
    "pandas>=2.0",
    "numpy>=1.24",
    "scipy>=1.11",
    "matplotlib>=3.7",
    "statsmodels>=0.14",
    "reservoirpy>=0.3",
    "qiskit-aer>=0.13",
    "pyyaml>=6.0",
]

[project.scripts]
QRCx = "QRCx.__main__:main"

[project.optional-dependencies]
cuda = ["cudaq>=0.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["QRCx*"]
